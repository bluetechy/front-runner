# The four sentences the SMS step can put on the login page.
#
# They are message keys rather than literals in the Java for the reason every
# other string on this page is: the login page is themed and translated, and a
# sentence compiled into a JAR is one nobody can translate. This file is the
# English; a Spanish login page needs messages_es.properties beside it.
#
# None of them says whether the account exists, has a number, or had a code
# outstanding. Somebody standing at this form has already got past a password,
# but the words are chosen as though they have not.
smsCodeWrong=That code was not right. We have sent another one.
smsCodeNotSent=We could not send a code to your phone just now. Try again in a few minutes.
# The two the send budget can raise. Neither offers a way to hurry it along,
# because there is not one: waiting is the whole mechanism.
smsCodeTooSoon=A code has just been sent. Use that one, or wait half a minute and ask again.
smsCodeTooMany=Too many codes have been sent to your phone. Wait a few minutes and start again.
