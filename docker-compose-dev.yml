services:
  keycloak-idp:
    build:
      context: ./apps/keycloak-idp
      dockerfile: Dockerfile
    # Production mode against PostgreSQL rather than start-dev against the
    # embedded store, so that what runs here is what would be deployed.
    # --import-realm only does anything on an empty Keycloak database.
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_ADDRESS}:${POSTGRES_PORT}/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Must be the address the browser uses: it is what Keycloak writes
      # into the token's issuer, and main-api compares that literally.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PUBLISHED_PORT}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Read by the SMS authenticator in the image, not by Keycloak itself:
      # where main-api's gateway route is and what to present to it. They are
      # environment variables rather than realm configuration because a secret
      # in realm configuration is a secret in the realm export, and the realm
      # export is a file in this repository. See apps/keycloak-idp/plugin.
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL}
      SMS_GATEWAY_SECRET: ${SMS_GATEWAY_SECRET}
    depends_on:
      main-db:
        condition: service_healthy
      main-mail:
        condition: service_started
    networks:
      - service-mesh
    ports:
      - "${KEYCLOAK_PUBLISHED_PORT}:${KEYCLOAK_PORT}"
    restart: unless-stopped
  main-api:
    build:
      # The whole repository, because the install is a workspace install
      # driven by the root package-lock.json.
      context: .
      dockerfile: ./apps/main-api/Dockerfile
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      POSTGRES_ADDRESS: main-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      # What main-api knows about any identity provider. The issuer is the
      # browser's address for it, because that is what ends up in the token;
      # the key set is fetched over the mesh. Both are spelled out in Keycloak's
      # realm shape here, which is the only Keycloak left in the IDP_ block.
      IDP_ISSUER_URL: http://localhost:${KEYCLOAK_PUBLISHED_PORT}/realms/${KEYCLOAK_REALM}
      IDP_JWKS_URL: http://${KEYCLOAK_ADDRESS}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      IDP_AUDIENCE: ${IDP_AUDIENCE}
      # KeycloakAdminService's own, and nothing else in main-api reads them.
      # Admin calls go over the mesh, like the key set, because they are this
      # process's rather than the browser's. The client id is the audience
      # because they are the same client.
      KEYCLOAK_ADMIN_URL: http://${KEYCLOAK_ADDRESS}:${KEYCLOAK_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${IDP_AUDIENCE}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY}
      # main-api sends the address-verification mail on the security page. The
      # same Mailpit container Keycloak sends its password resets through.
      MAIL_ADDRESS: ${MAIL_ADDRESS}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      # The browser's address for main-gui, because it goes into a link
      # somebody opens on their own machine.
      APP_BASE_URL: ${APP_BASE_URL}
      # Whether refused logins are mirrored out of Keycloak's event log onto
      # the security page. On unless .env says otherwise, and the one event
      # type on that page with a switch: nothing deduplicates a failed login,
      # so a realm being scanned can fill somebody's page with them. Set it to
      # false here, or in .env, if this gets noisy.
      #
      # It does not turn off the mirror, only this half of it: logouts are read
      # on the same poll and are capped at one row per session, so they have no
      # switch and need none. The realm has to be keeping LOGIN_ERROR, LOGOUT
      # and REFRESH_TOKEN_ERROR events -- see apps/keycloak-idp/README.md.
      SECURITY_LOG_FAILED_LOGINS: ${SECURITY_LOG_FAILED_LOGINS:-true}
      # Twilio, and the secret Keycloak's SMS authenticator presents when it
      # asks for a login code to be carried. Empty in this repository: with
      # nothing here main-api reports SMS unavailable, the security page says
      # so, and the gateway route refuses every caller.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMS_GATEWAY_SECRET: ${SMS_GATEWAY_SECRET:-}
    depends_on:
      main-db:
        condition: service_healthy
      main-mail:
        condition: service_started
    networks:
      - service-mesh
    ports:
      - "${API_PUBLISHED_PORT}:${API_PORT}"
    restart: unless-stopped
    init: true
    volumes:
      - "./apps/main-api/src:/app/apps/main-api/src:ro"
  main-db:
    build:
      context: ./apps/main-db
      dockerfile: Dockerfile
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - service-mesh
    ports:
      - ${POSTGRES_PUBLISHED_PORT}:${POSTGRES_PORT}
    restart: always
    volumes:
      - main-db-data:/var/lib/postgresql
      # Mounted rather than baked in so editing the SQL and running
      # `make db-rebuild` picks it up without a docker build.
      - "./apps/main-db/sql:/sql:ro"
      - "./apps/main-db/bin:/opt/main-db/bin:ro"
  main-gui:
    build:
      # The whole repository, because the install is a workspace install
      # driven by the root package-lock.json.
      context: .
      dockerfile: ./apps/main-gui/Dockerfile
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Docker Desktop bind mounts do not deliver inotify events reliably,
      # so Vite polls for changes inside the container instead.
      VITE_WATCH_POLLING: "true"
    depends_on:
      - main-api
    networks:
      - service-mesh
    ports:
      - "${GUI_PUBLISHED_PORT}:${GUI_PORT}"
    restart: unless-stopped
    init: true
    volumes:
      # Read-write: the TanStack Router plugin regenerates
      # src/routeTree.gen.ts on every route change.
      - "./apps/main-gui:/app/apps/main-gui"
      # Shield the container's hoisted install from anything on the host.
      - "/app/apps/main-gui/node_modules"
  main-mail:
    # Mailpit accepts every message and delivers none of them: Keycloak's
    # password-reset mail stops at the web inbox on 30004. Development only --
    # a real deployment points KC_SMTP at a real server.
    image: axllent/mailpit:v1.28
    networks:
      - service-mesh
    ports:
      - "${MAIL_UI_PUBLISHED_PORT}:${MAIL_UI_PORT}"
    restart: unless-stopped
  main-kvs:
    image: redis:8.10.1
    networks:
      - service-mesh
    ports:
      - ${REDIS_PUBLISHED_PORT}:${REDIS_PORT}
    restart: always
networks:
  service-mesh: {}
volumes:
  main-db-data: {}
