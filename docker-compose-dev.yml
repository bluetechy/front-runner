services:
    main-api:
        build:
            context: .
            dockerfile: apps/main-api/Dockerfile
            target: development
        env_file:
            - .env
        environment:
            NODE_ENV: development
            POSTGRES_ADDRESS: main-db
            POSTGRES_PORT: 5432
            POSTGRES_DATABASE: ${APP_DB_NAME}
            POSTGRES_USER: ${APP_DB_USER}
            POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
            CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
            HYDRA_BASE_URL: ${HYDRA_BASE_URL:-https://hydraqa.unicity.net/v5a-test}
            HYDRA_NAMESPACE: ${HYDRA_NAMESPACE:-https://hydraqa.unicity.net/v5a-test/employees}
        depends_on:
            main-db:
                condition: service_healthy
        networks:
            - service-mesh
        ports:
            - "${API_PUBLISHED_PORT}:${API_PORT}"
        restart: unless-stopped
        init: true
        volumes:
            - "./apps/main-api/src:/app/apps/main-api/src:ro"
    main-db:
        build:
            context: ./apps/main-db
            dockerfile: Dockerfile
        env_file:
            - .env
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${APP_DB_NAME}" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s
        networks:
            - service-mesh
        ports:
            - ${POSTGRES_PUBLISHED_PORT}:${POSTGRES_PORT}
        restart: always
        volumes:
            - main-db-data:/var/lib/postgresql
            # Mounted rather than baked in so editing the SQL and running
            # `make db-rebuild` picks it up without a docker build.
            - "./apps/main-db/sql:/sql:ro"
            - "./apps/main-db/bin:/opt/main-db/bin:ro"
#    main-gui:
#        build:
#            context: ./apps/main-gui
#            dockerfile: Dockerfile
#            target: stage2
#        env_file:
#            - .env
#        networks:
#            - service-mesh
#        ports:
#            - ${GUI_PUBLISHED_PORT}:${GUI_PORT}
#        restart: always
#        stdin_open: true
#        volumes:
#            - "./apps/main-gui/src:/app/src"
    main-kvs:
        image: redis:8.10.1
        networks:
            - service-mesh
        ports:
            - ${REDIS_PUBLISHED_PORT}:${REDIS_PORT}
        restart: always
networks:
    service-mesh: {}
volumes:
    main-db-data: {}
